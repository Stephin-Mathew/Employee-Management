<main class="employee-panel page-card">
        <app-table-header
          (searchChange)="onSearchChange($event)"
          [canAdd]="canAdd"
          (addEmployee)="openAddModal()"
        ></app-table-header>

        <app-custom-table
          [rows]="employees()"
          [columns]="employeeColumns"
          [searchTerm]="searchTerm"
          [searchKeys]="employeeSearchKeys"
          [canEdit]="canEdit"
          [canDelete]="canDelete"
          (rowAction)="onTableAction($event)"
        ></app-custom-table>

        @if (showEmployeeModal) {
          <app-employee-modal
            [employee]="selectedEmployee"
            [existingEmployees]="employees()"
            (save)="saveEmployee($event)"
            (cancel)="closeEmployeeModal()"
          ></app-employee-modal>
        }

        @if (showDeleteModal && employeeToDelete) {
          <app-delete-modal
            [employee]="employeeToDelete"
            (confirm)="confirmDelete($event)"
            (cancel)="cancelDelete()"
          ></app-delete-modal>
        }

</main>
